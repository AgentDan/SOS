<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deskOS</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
      canvas { display: block; }
      #question-panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: 280px;
        padding: 12px 14px;
        background: rgba(18, 18, 18, 0.9);
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        border-radius: 8px;
        pointer-events: auto;
      }
      #question-panel p { margin: 0 0 8px; }
      #question-panel button {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="scene-canvas"></canvas>
    <div id="question-panel"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
